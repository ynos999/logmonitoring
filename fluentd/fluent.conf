<source>
  @type tail
  # path /fluentd/log/app.log
  path /fluentd/log/*.log
  pos_file "/fluentd/pos/app.log.pos"
  tag app.logs
  <parse>
    @type json
  </parse>
</source>

<match app.logs>
  @type kafka2
  brokers kafka:29092
  default_topic app-logs
  <format>
    @type json
  </format>
</match>

<buffer>
  @type memory
  flush_interval 5s
</buffer>
